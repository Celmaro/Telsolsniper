[package]
name = "shadow-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shadow trading engine for Telsolsniper: consumes Telegram new_mint events, resolves real Pump.fun curves, simulates entries/exits, records results. No transactions are broadcast."

[dependencies]
anyhow = "1"
bs58 = "0.5"
dotenvy = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sol-trade-sdk = { path = "../.." }
solana-sdk = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
