[package]
name = "price-feed"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared pumpapi.io price-tick consumer for the Telsolsniper engines. Read-only: no key, no funds, no orders."

[dependencies]
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
