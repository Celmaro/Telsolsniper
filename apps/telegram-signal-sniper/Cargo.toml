[package]
name = "telegram-signal-sniper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Telegram signal intake and durable deduplication service for Telsolsniper"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
